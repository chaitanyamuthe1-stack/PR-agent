services:
  - type: web
    name: pr-agent-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTO_START_OLLAMA
        value: "0"
      - key: FRONTEND_ORIGINS
        sync: false
        # e.g., https://your-project.vercel.app,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
